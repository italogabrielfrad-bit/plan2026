<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Antigravity 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #0B0E14;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        .glow-violet {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .pulse-orb {
            animation: pulse-orb 3s ease-in-out infinite;
        }

        @keyframes pulse-orb {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
                filter: blur(2px);
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
                filter: blur(4px);
            }
        }

        .bg-nebula {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15), transparent),
                radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.1), transparent);
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #06b6d4;
            margin-top: -6px;
            box-shadow: 0 0 10px #06b6d4;
        }
    </style>

</head>

<body class="bg-nebula">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
